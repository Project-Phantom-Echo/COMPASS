[project]
name = "compass-har"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
description = "COMPASS: complete multimodal fusion for ubiquitous sensing"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "einops>=0.6.0",
    "matplotlib>=3.6.0",
    "numpy>=1.23.0,<2",
    "opencv-python>=4.5.0",
    "pandas>=1.5.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.1.0",
    "scipy>=1.9.0",
    "torch==2.1.1",
    "torchaudio==2.1.1",
    "torchvision==0.16.1",
    "tqdm>=4.60.0",
]

[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
